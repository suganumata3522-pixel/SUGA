services:
  backend:
    build: ./backend
    container_name: suga-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - suga-data:/app/data
      - suga-uploads:/app/uploads
    environment:
      - SUGA_DB_URL=sqlite:////app/data/suga.db
      - SUGA_UPLOAD_DIR=/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: suga-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    environment:
      - VITE_API_BASE=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0

volumes:
  suga-data:
  suga-uploads:
