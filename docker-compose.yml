# 単一コンテナ構成。フロント・バックを 1 つにまとめ、ポート 8000 のみ公開。
#   docker compose up -d --build   で起動
#   ブラウザで http://localhost:8000 （他PCからは http://<ホストIP>:8000）
services:
  suga:
    build: .
    container_name: suga
    ports:
      - "8000:8000"
    volumes:
      - suga-data:/app/SUGA-data
    environment:
      - SUGA_DATA_DIR=/app/SUGA-data
    restart: unless-stopped

volumes:
  suga-data:
