# 単一コンテナ構成。フロント・バックを 1 つにまとめ、ポート 8000 のみ公開。
#   docker compose up -d --build   で起動
#   ブラウザで http://localhost:8000 （他PCからは http://<ホストIP>:8000）
services:
  yhg:
    build: .
    container_name: yhg
    ports:
      - "8000:8000"
    volumes:
      - yhg-data:/app/YHG-data
    environment:
      - YHG_DATA_DIR=/app/YHG-data
    restart: unless-stopped

volumes:
  yhg-data:
